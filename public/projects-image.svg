<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="projectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- House -->
  <polygon points="150,150 200,100 250,150 250,220 150,220" fill="url(#projectGrad)" stroke="#2e7d32" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="140,150 200,90 260,150" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
  <!-- Door -->
  <rect x="190" y="180" width="20" height="40" fill="#8d6e63"/>
  <!-- Windows -->
  <rect x="160" y="170" width="15" height="15" fill="#81c784"/>
  <rect x="225" y="170" width="15" height="15" fill="#81c784"/>
  <!-- Trees -->
  <circle cx="100" cy="200" r="20" fill="#4caf50"/>
  <rect x="95" y="220" width="10" height="30" fill="#8d6e63"/>
  <circle cx="300" cy="190" r="25" fill="#4caf50"/>
  <rect x="295" y="215" width="10" height="35" fill="#8d6e63"/>
  <!-- People working -->
  <circle cx="180" cy="240" r="8" fill="#ff9800"/>
  <rect x="175" y="248" width="10" height="20" fill="#ff9800"/>
  <circle cx="220" cy="235" r="6" fill="#2196f3"/>
  <rect x="217" y="241" width="6" height="15" fill="#2196f3"/>
  <!-- Tools -->
  <rect x="170" y="260" width="30" height="3" fill="#424242"/>
  <rect x="210" y="255" width="3" height="20" fill="#424242"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">Community Architecture Projects</text>
</svg>