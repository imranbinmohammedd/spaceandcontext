<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="studyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa"/>
  <!-- Desk -->
  <rect x="120" y="180" width="160" height="10" fill="#8d6e63"/>
  <rect x="100" y="190" width="200" height="80" fill="#a1887f"/>
  <!-- Chair -->
  <rect x="180" y="200" width="40" height="40" fill="#795548"/>
  <rect x="185" y="240" width="30" height="30" fill="#5d4037"/>
  <!-- Computer -->
  <rect x="140" y="160" width="120" height="20" fill="#424242" rx="2"/>
  <rect x="160" y="140" width="80" height="20" fill="#616161" rx="2"/>
  <!-- Books -->
  <rect x="130" y="200" width="20" height="30" fill="#ff9800"/>
  <rect x="155" y="205" width="18" height="25" fill="#2196f3"/>
  <rect x="180" y="200" width="22" height="32" fill="#4caf50"/>
  <!-- Students -->
  <circle cx="220" cy="150" r="12" fill="#ff5722"/>
  <rect x="215" y="162" width="10" height="18" fill="#ff5722"/>
  <circle cx="250" cy="145" r="10" fill="#3f51b5"/>
  <rect x="247" y="155" width="6" height="15" fill="#3f51b5"/>
  <!-- Light bulb (idea) -->
  <circle cx="320" cy="100" r="15" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <path d="M 320 85 Q 315 80 320 75 Q 325 80 320 85" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <!-- Graduation cap -->
  <polygon points="240,130 260,130 265,125 235,125" fill="#000"/>
  <rect x="235" y="125" width="30" height="3" fill="#000"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">Architecture Education</text>
</svg>